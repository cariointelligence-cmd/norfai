version: 1
project: Norf
updated: 2026-09-12
sources:
  - id: ytj
    type: api
    locator: https://avoindata.prh.fi/opendata-ytj-api/v3/companies
    license: CC-BY-4.0
    terms_url: https://www.prh.fi/en/presentation_and_duties/uutislistaus/announcements/2024/open-data-revamped.html
    auth: none
    freshness:
      mode: poll
      interval: 1d
    schema_ref: hive/contracts/company.yaml
    reliability: high
    reliability_note: Official Finnish Trade Register / YTJ. Page size 100. 5-digit TOL.
    layer: sensors
    status: wired
    code_origin: src/lib/norr/sources/ytj.ts
    notes: Official first. mainBusinessLine is substring so always 5-digit children. Maps registeredEntries (VAT, employer, prepayment).
  - id: apify
    type: api
    locator: https://api.apify.com/v2
    license: Apify platform terms
    terms_url: https://docs.apify.com/platform
    auth: bearer
    secret_env: APIFY_API
    freshness:
      mode: on-demand
      interval: 6h
    schema_ref: hive/contracts/company.yaml
    reliability: low
    reliability_note: Additional collection layer only. Never a register of record. Official YTJ wins conflicts. Named Actors: Finder.fi gap-fill, Finder fallback on technical failure, Google Maps last-resort website.
    layer: sensors
    status: wired
    code_origin: src/lib/norr/sources/apify.ts
    notes: Platform adapter. APIFY_TOOLS = finder-fi-scraper, finnish-business-finder-scraper, crawler-google-places. Cost-capped. Kill-switch source_id=apify.
  - id: ytj-postcodes
    type: api
    locator: https://avoindata.prh.fi/opendata-ytj-api/v3/post_codes?lang=1
    license: CC-BY-4.0
    terms_url: https://avoindata.prh.fi/en
    auth: none
    freshness:
      mode: poll
      interval: 7d
    schema_ref: hive/contracts/company.yaml
    reliability: high
    reliability_note: Official post code / municipality list. Used for health and location quality, not company invention.
    layer: sensors
    status: accepted
    code_origin: src/lib/norr/sources/ytj.ts
    notes: Live 200 JSON. Folded into ytj Sensor, not a parallel company source.
  - id: prh-xbrl
    type: api
    locator: https://avoindata.prh.fi/opendata-xbrl-api/v3/financials
    license: CC-BY-4.0
    terms_url: https://avoindata.prh.fi/en
    auth: none
    freshness:
      mode: poll
      interval: 1d
    schema_ref: hive/contracts/company.yaml
    reliability: medium
    reliability_note: Empty financials stay UNAVAILABLE. Nokia returns totalResults 0.
    layer: sensors
    status: wired
    code_origin: src/lib/norr/sources/homemade.ts
    notes: Honest empty. Never invent revenue.
  - id: prh-krek
    type: api
    locator: https://avoindata.prh.fi/en/krek/swagger-ui
    license: CC-BY-4.0
    terms_url: https://avoindata.prh.fi/en
    auth: none
    freshness:
      mode: poll
      interval: 1d
    schema_ref: hive/contracts/company.yaml
    reliability: medium
    reliability_note: Registered notifications UI exists. Working JSON path not confirmed (404 on guessed URLs).
    layer: sensors
    status: candidate
    code_origin: null
    notes: Do not wire a 404 adapter. Revisit when swagger exposes a live path.
  - id: prh-bis-v1
    type: api
    locator: https://avoindata.prh.fi/bis/v1
    license: CC-BY-4.0
    terms_url: https://avoindata.prh.fi/en
    auth: none
    freshness:
      mode: poll
      interval: 1d
    schema_ref: hive/contracts/company.yaml
