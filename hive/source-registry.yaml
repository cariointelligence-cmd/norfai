    reliability_note: Superseded by YTJ v3. Adapter exists but is unused.
    layer: sensors
    status: rejected
    code_origin: src/lib/norr/sources/prh-bis.ts
    notes: Rejected as a parallel truth. YTJ v3 is the official FI register.
