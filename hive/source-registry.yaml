  - query: API Registered notifications PRH krek swagger
    where: web
    date: 2026-09-12
    kept: [prh-krek]
    rejected: []
  - query: Työmarkkinatori API avoin data työpaikat
    where: web
    date: 2026-09-12
    kept: []
    rejected: [tyomarkkinatori-api]
  - query: avoindata.fi yritykset rekisteri Transparency Register
    where: catalog
    date: 2026-09-12
    kept: [avoimuusrekisteri]
    rejected: []
  - query: site:github.com YTJ PRH opendata client MIT
    where: github
    date: 2026-09-12
    kept: []
    rejected: [finnish-business-portal, pexxi-prh-ytj]
